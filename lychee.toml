# Link checking configuration for lychee – https://lychee.cli.rs
# Run locally with `just check-links`; also runs in CI.

# Sites that block automated checks (401/403/bot detection).
exclude = [
  'https://x\.com/.*',
  'https://www\.linkedin\.com/.*',
  'https://discord\.com/.*',
  'https://www\.reuters\.com/.*',
  'https://www\.researchgate\.net/.*',
  'https://medium\.com/.*',
  'https://dl\.acm\.org/.*',
  'https://www\.science\.org/.*',
  # Known-broken sources in next-js.md, pending the step-2 sourcing review.
  'https://nextjs\.org/blog/CVE-2025-55183',
  'https://nextjs\.org/blog/CVE-2025-55184',
  'https://nextjs\.org/blog/understanding-react-server-components',
  # The FOSDEM 2027 talk CfP goes live only after devrooms are accepted, so the
  # draft Python devroom CfP refers to the URL before it exists. The
  # `fosdem.org/submit` shortlink redirects to that same not-yet-live page.
  'https://pretalx\.fosdem\.org/fosdem-2027/cfp',
  'https://fosdem\.org/submit',
  # Cited in the devroom-organization page as a deliberately dead archive (404).
  'https://lists\.fosdem\.org/pipermail/python-devroom/',
]

# Theme templates contain Jinja placeholders, not real links.
# The FOSDEM XML cache is raw upstream data (with dead/relative links), not our own content.
exclude_path = ["docs/theme", "tools/_fosdem_xml_cache"]

# Accept rate limiting as a non-failure (retries were already attempted).
accept = [200, 204, 429]
